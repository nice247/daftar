services:
  # ============ Backend API Service ============
  - type: web
    name: daftar-tajir-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daftar-tajir-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: False
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_PHONE
        value: "0902642768"
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: '["https://daftar-tajir.onrender.com"]'
      - key: PYTHON_VERSION
        value: "3.12.4"
    healthCheckPath: /health
    plan: free

  # ============ Frontend Static Site ============
  - type: web
    name: daftar-tajir-frontend
    runtime: static
    buildCommand: cd ../daftar-al-tajir-frontend && npm install && npm run build
    staticPublishPath: ../daftar-al-tajir-frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://daftar-tajir-api.onrender.com/api/v1"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Cache-Control
        value: no-cache

# ============ Neon PostgreSQL Database ============
databases:
  - name: daftar-tajir-db
    databaseName: daftar_tajir
    plan: free
