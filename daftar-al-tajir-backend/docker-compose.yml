version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daftar_tajir
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: daftar-al-tajir-backend/Dockerfile
    ports:
      - "80:80"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/daftar_tajir
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/daftar_tajir
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - ADMIN_PHONE=${ADMIN_PHONE:-0902642768}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-nice@247}
      - VITE_API_URL=/api/v1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
